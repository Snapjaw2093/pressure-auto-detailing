<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <rect width="500" height="500" fill="none" />

  <!-- Outer badge -->
  <path d="M250 40 L430 145 L430 355 L250 460 L70 355 L70 145 Z" fill="#0a0a0a" stroke="url(#silverStroke)" stroke-width="6" stroke-linejoin="round"/>

  <!-- Inner ring -->
  <path d="M250 74 L400 160 L400 340 L250 426 L100 340 L100 160 Z" fill="none" stroke="#27272a" stroke-width="2"/>

  <!-- Faint monogram -->
  <text x="250" y="282" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="170" fill="#e4e4e7" text-anchor="middle" dominant-baseline="middle" opacity="0.10">B</text>

  <!-- Chrome reflection streaks -->
  <line x1="120" y1="340" x2="380" y2="160" stroke="url(#chromeStreak)" stroke-width="30" stroke-linecap="round"/>
  <line x1="150" y1="382" x2="352" y2="244" stroke="url(#chromeStreak)" stroke-width="10" stroke-linecap="round" opacity="0.6"/>

  <defs>
    <linearGradient id="silverStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e4e4e7" />
      <stop offset="50%" stop-color="#52525b" />
      <stop offset="100%" stop-color="#d4d4d8" />
    </linearGradient>
    <linearGradient id="chromeStreak" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3f3f46" stop-opacity="0" />
      <stop offset="45%" stop-color="#f4f4f5" stop-opacity="0.95" />
      <stop offset="55%" stop-color="#f4f4f5" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#3f3f46" stop-opacity="0" />
    </linearGradient>
  </defs>
</svg>
